<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>DOSTA</title>

<style>
:root{
  --bg:#f7f8fa;
  --card:#fff;
  --text:#17181c;
  --muted:#747983;
  --line:#e8e9ed;
  --accent:#111827;
  --blue:#2563eb;
  --danger:#ef4444;
  --radius:18px;

}

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
img,video{max-width:100%;display:block}
.hidden{display:none!important}

#app{min-height:100vh}
.page{max-width:760px;margin:auto;padding:18px 14px 95px}

.topbar{
  position:sticky;top:0;z-index:30;
  height:62px;background:rgba(255,255,255,.94);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;
}
.logo{font-size:25px;font-weight:900;letter-spacing:-1.2px}
.top-title{font-weight:800;font-size:18px}
.icon-btn{
  width:42px;height:42px;border-radius:50%;
  background:#f1f2f5;display:grid;place-items:center;
  font-size:20px;
}
.icon-btn:active{transform:scale(.94)}

.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:100;
  height:72px;background:rgba(255,255,255,.96);
  backdrop-filter:blur(18px);
  border-top:1px solid var(--line);

}
.nav-inner{width:100%;max-width:760px;display:grid;grid-template-columns:repeat(5,1fr)}
.nav-btn{

  font-size:23px;color:#777;
}
.nav-btn.active{color:#111}
.nav-avatar{
  width:27px;height:27px;border-radius:50%;object-fit:cover;
  border:2px solid #ddd;
}
.nav-btn small{display:none}

.fab{
  position:fixed;right:20px;bottom:88px;z-index:90;

.card{

}
.stack{display:grid;gap:14px}

.auth{

.auth-box{width:min(420px,100%);padding:28px}
.auth-logo{text-align:center;font-size:42px;font-weight:950;margin-bottom:8px}

textarea.input{min-height:110px;resize:vertical}

.btn{

.label{font-size:13px;font-weight:700;color:#555}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 18px}
.stat{padding:15px;text-align:center}

.modal-back{

/* =========================================================
   CLOUDINARY UPLOAD
========================================================= */

async function cloudinaryUpload(file,onProgress=()=>{}){
  if(!file)throw new Error("Файл тандалган жок.");

  const isVideo=file.type.startsWith("video/");
  const resourceType=isVideo?"video":"auto";

  /*
    Чоң видео үчүн Cloudinary chunked upload.
    Browser XHR + Content-Range + unique upload id.
  */

  if(isVideo && file.size>10*1024*1024){
    return cloudinaryChunkUpload(file,onProgress);
  }

  const url=`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${resourceType}/upload`;

  const form=new FormData();
  form.append("file",file);
  form.append("upload_preset",UPLOAD_PRESET);

  return new Promise((resolve,reject)=>{
    const xhr=new XMLHttpRequest();

    xhr.open("POST",url);

    xhr.upload.onprogress=e=>{
      if(e.lengthComputable){
        onProgress(Math.round(e.loaded/e.total*100),e.loaded,e.total);
      }
    };

    xhr.onload=()=>{
      if(xhr.status>=200&&xhr.status<300){
        try{resolve(JSON.parse(xhr.responseText))}
        catch{reject(new Error("Cloudinary response error"))}
      }else reject(new Error("Cloudinary upload error: "+xhr.status));
    };

    xhr.onerror=()=>reject(new Error("Интернет байланышы үзүлдү."));
    xhr.send(form);
  });
}


async function cloudinaryChunkUpload(file,onProgress){
  const url=`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/upload`;
  const chunkSize=6*1024*1024;
  const uploadId=crypto.randomUUID();
  let start=0;
  let result=null;

  while(start<file.size){
    let end=Math.min(start+chunkSize,file.size);
    let chunk=file.slice(start,end);

    let attempts=0;

    while(true){
      try{
        result=await new Promise((resolve,reject)=>{
          const xhr=new XMLHttpRequest();

          xhr.open("POST",url);
          xhr.setRequestHeader("X-Unique-Upload-Id",uploadId);
          xhr.setRequestHeader(
            "Content-Range",
            `bytes ${start}-${end-1}/${file.size}`
          );

          const form=new FormData();
          form.append("file",chunk);
          form.append("upload_preset",UPLOAD_PRESET);

          xhr.upload.onprogress=e=>{
            if(e.lengthComputable){
              const overall=start+e.loaded;
              onProgress(
                Math.round(overall/file.size*100),
                overall,
                file.size
              );
            }
          };

          xhr.onload=()=>{
            if(xhr.status>=200&&xhr.status<300){
              try{resolve(JSON.parse(xhr.responseText))}
              catch{reject(new Error("Cloudinary response error"))}
            }else{
              reject(new Error("Chunk upload "+xhr.status));
            }
          };

          xhr.onerror=()=>reject(new Error("network"));
          xhr.send(form);
        });

        break;
      }catch(err){
        attempts++;

        if(attempts>=5)throw err;

        await new Promise(r=>setTimeout(r,1500*attempts));
      }
    }

    start=end;
  }

  return result;
}

async function loginGoogle(){

async function ensureUser(user){
  const ref=doc(db,"users",user.uid);
  const snap=await getDoc(ref);

  if(!snap.exists()){
    await setDoc(ref,{
      uid:user.uid,
      name:user.displayName||"DOSTA колдонуучусу",
      email:user.email||"",
      phone:"",
      age:"",
      photo:user.photoURL||"",
      role:user.email?.toLowerCase()===ADMIN_EMAIL.toLowerCase()?"admin":"user",
      createdAt:serverTimestamp()
    });
  }
}

/* =========================================================
   HOME / POSTS
========================================================= */

async function loadPosts(reset=false){
  if(loadingPosts||noMorePosts)return;
  loadingPosts=true;

  const container=document.getElementById("posts");

  if(reset){
    postCursor=null;
    noMorePosts=false;
    if(container)container.innerHTML=`
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>`;
  }

  try{
    let q=query(
      collection(db,"posts"),
      orderBy("createdAt","desc"),
      limit(3)
    );

    if(postCursor){
      q=query(
        collection(db,"posts"),
        orderBy("createdAt","desc"),
        startAfter(postCursor),
        limit(3)
      );
    }

    const snap=await getDocs(q);

    if(snap.empty){
      noMorePosts=true;
      if(container&&!postCursor){
        container.innerHTML=`<div class="card empty">
          Азырынча пост жок.<br><br>Биринчи постту сиз кошуңуз.
        </div>`;
      }
      return;
    }

    if(!postCursor&&container)container.innerHTML="";

    snap.forEach(d=>{
      container?.insertAdjacentHTML("beforeend",postHTML(d.id,d.data()));
    });

    postCursor=snap.docs[snap.docs.length-1];

  }catch(err){
    console.error(err);
    if(container)container.innerHTML=`
      <div class="card empty">Постторду жүктөөдө ката кетти.</div>`;
  }finally{
    loadingPosts=false;
  }
}

function postHTML(id,p){
  const liked=(p.likes||[]).includes(currentUser.uid);

  let media="";
  if(p.imageUrl){
    media=`<img class="post-media" loading="lazy" src="${esc(p.imageUrl)}">`;
  }

  if(p.videoUrl){
    media=`<video class="post-media" controls preload="metadata" src="${esc(p.videoUrl)}"></video>`;
  }

  return `
  <article class="card post" data-post="${id}">

    <div class="post-head">
      <img class="avatar" src="${avatar(p.authorPhoto,p.authorName)}">

      <div>
        <div class="user-name">${esc(p.authorName||"Колдонуучу")}</div>
        <div class="user-sub">${timeText(p.createdAt)}</div>
      </div>

      ${p.authorId===currentUser.uid?
        `<button class="more" data-more="${id}">⋯</button>`:""}
    </div>

    ${p.text?`<div class="post-text">${esc(p.text)}</div>`:""}

    ${media}

    <div class="post-actions">
      <button class="action ${liked?"liked":""}" data-like="${id}">
        ${liked?"♥":"♡"}
      </button>

      <span class="like-count">${p.likeCount||0}</span>

      <button class="action" data-likes="${id}">👥</button>

      <button class="comments-link" data-comments="${id}">
        💬 ${p.commentCount||0} комментарий
      </button>
    </div>

  </article>`;
}


async function toggleLike(postId){
  const ref=doc(db,"posts",postId);
  const snap=await getDoc(ref);
  if(!snap.exists())return;

  const data=snap.data();
  const likes=data.likes||[];
  const has=likes.includes(currentUser.uid);

  await updateDoc(ref,{
    likes:has?arrayRemove(currentUser.uid):arrayUnion(currentUser.uid),
    likeCount:increment(has?-1:1)
  });

  const btn=document.querySelector(`[data-like="${postId}"]`);
  const count=document.querySelector(`[data-post="${postId}"] .like-count`);

  if(btn){
    btn.textContent=has?"♡":"♥";
    btn.classList.toggle("liked",!has);
  }
  if(count)count.textContent=Math.max(0,(data.likeCount||0)+(has?-1:1));
}


async function showLikes(postId){
  const snap=await getDoc(doc(db,"posts",postId));
  if(!snap.exists())return;

  const ids=snap.data().likes||[];

  if(!ids.length){
    modal(`<div class="modal-head">
      <div class="modal-title">Лайктар</div>
      <button class="icon-btn" onclick="closeModal()">×</button>
    </div><div class="empty">Азырынча лайк жок.</div>`);
    return;
  }

  let html=`
  <div class="modal-head">
    <div class="modal-title">Лайк баскандар</div>
    <button class="icon-btn" onclick="closeModal()">×</button>
  </div>
  <div class="stack">`;

  for(const uid of ids.slice(0,100)){
    const u=await getProfile(uid);
    if(u){
      html+=`
      <div class="user-result">
        <img class="avatar sm" src="${avatar(u.photo,u.name)}">
        <b>${esc(u.name)}</b>
      </div>`;
    }
  }

  html+=`</div>`;
  modal(html);
}


async function showComments(postId){
  const snap=await getDocs(query(
    collection(db,"posts",postId,"comments"),
    orderBy("createdAt","asc")
  ));

  let comments="";

  snap.forEach(d=>{
    const c=d.data();
    comments+=`
      <div style="display:flex;gap:9px;margin:12px 0">
        <img class="avatar sm" src="${avatar(c.authorPhoto,c.authorName)}">
        <div>
          <b>${esc(c.authorName)}</b>
          <div>${esc(c.text)}</div>
        </div>
      </div>`;
  });

  if(!comments)comments=`<div class="empty">Комментарий жок.</div>`;

/* =========================================================
   TIMER
========================================================= */

function renderExercise(container,m){
  const timer=m.timer||{
    preparation:10,
    work:30,
    rest:10,
    rounds:3
  };

  let phase="preparation";
  let remaining=timer.preparation;
  let round=1;
  let running=false;
  let interval=null;

  container.querySelector("#exerciseContent").innerHTML=`
    ${m.coverUrl?`<img class="cover" src="${esc(m.coverUrl)}">`:""}

    ${m.fileUrl?
      `<video controls style="width:100%;border-radius:15px"
       src="${esc(m.fileUrl)}"></video>`:""}

    <div class="timer">
      <div class="timer-phase" id="timerPhase">Даярдык</div>
      <div class="timer-time" id="timerTime">${formatSeconds(remaining)}</div>
      <div class="timer-round" id="timerRound">
        Раунд ${round} / ${timer.rounds}
      </div>

      <div class="timer-actions">
        <button class="btn" id="timerStart">Баштоо</button>
        <button class="btn secondary" id="timerPause">Pause</button>
        <button class="btn secondary" id="timerReset">Reset</button>
      </div>
    </div>
  `;

  const phaseEl=container.querySelector("#timerPhase");
  const timeEl=container.querySelector("#timerTime");
  const roundEl=container.querySelector("#timerRound");

  function draw(){
    const labels={
      preparation:"Даярдык",
      work:"Иштөө",
      rest:"Эс алуу"
    };

    phaseEl.textContent=labels[phase];
    timeEl.textContent=formatSeconds(remaining);
    roundEl.textContent=`Раунд ${round} / ${timer.rounds}`;
  }

  function next(){
    if(phase==="preparation"){
      phase="work";
      remaining=timer.work;
      return;
    }

    if(phase==="work"){
      if(round>=timer.rounds){
        running=false;
        clearInterval(interval);
        phase="preparation";
        remaining=timer.preparation;
        toast("Көнүгүү бүттү.");
        draw();
        return;
      }

      phase="rest";
      remaining=timer.rest;
      return;
    }

    if(phase==="rest"){
      round++;
      phase="work";
      remaining=timer.work;
    }
  }

  function tick(){
    if(!running)return;

    remaining--;

    if(remaining<=0)next();
    draw();
  }

  container.querySelector("#timerStart").onclick=()=>{
    if(running)return;
    running=true;
    clearInterval(interval);
    interval=setInterval(tick,1000);
  };

  container.querySelector("#timerPause").onclick=()=>{
    running=false;
    clearInterval(interval);
  };

  container.querySelector("#timerReset").onclick=()=>{
    running=false;
    clearInterval(interval);
    phase="preparation";
    remaining=timer.preparation;
    round=1;
    draw();
  };

  draw();
}

function formatSeconds(n){
  n=Math.max(0,n);
  return `${String(Math.floor(n/60)).padStart(2,"0")}:${String(n%60).padStart(2,"0")}`;
}

function renderChat(uid,u){
  app.innerHTML=`
    <header class="topbar">
      <button class="icon-btn" id="chatBack">‹</button>

      <div style="display:flex;align-items:center;gap:9px">
        <img class="avatar sm" src="${avatar(u.photo,u.name)}">
        <div class="top-title">${esc(u.name)}</div>

    </header>

    <main class="page">
      <div class="chat-layout">

        <div class="messages" id="messages"></div>

        <form class="chat-input" id="chatForm">
          <input class="input" name="message"
            placeholder="Кат жазыңыз..." autocomplete="off">
          <button class="btn">➤</button>
        </form>

      </div>
    </main>

    ${bottomNav()}
  `;

  document.getElementById("chatBack").onclick=()=>{
    currentPage="search";
    render();
  };

  const id=chatId(currentUser.uid,uid);

  if(unsubscribeMessages)unsubscribeMessages();

  unsubscribeMessages=onSnapshot(
    query(
      collection(db,"chats",id,"messages"),
      orderBy("createdAt","asc")
    ),
    snap=>{
      const box=document.getElementById("messages");
      if(!box)return;

      box.innerHTML="";

      snap.forEach(d=>{
        const m=d.data();
        const mine=m.senderId===currentUser.uid;

        box.insertAdjacentHTML("beforeend",`
          <div class="bubble-row ${mine?"mine":""}">
            <div class="bubble">
              ${esc(m.text)}
              ${mine?
                `<span class="msg-status">
                  ${m.read?"✓✓":"✓"}
                </span>`:""}
            </div>
          </div>
        `);
      });

      box.scrollTop=box.scrollHeight;
    }
  );

  document.getElementById("chatForm").onsubmit=async e=>{
    e.preventDefault();

    const text=e.target.message.value.trim();
    if(!text)return;

    const chatRef=doc(db,"chats",id);

    await setDoc(chatRef,{
      participants:[currentUser.uid,uid],
      updatedAt:serverTimestamp(),
      lastMessage:text
    },{merge:true});

    await addDoc(collection(db,"chats",id,"messages"),{
      senderId:currentUser.uid,
      receiverId:uid,
      text,
      read:false,
      createdAt:serverTimestamp()
    });

    e.target.reset();
  };
}

========================================================= */

  ));

  return `

      <div>
        <div class="profile-name">
          ${esc(currentProfile?.name||"Колдонуучу")}
        </div>

        ${isAdmin()?
          `<div class="user-sub">Администратор</div>`:
          `<div class="user-sub">DOSTA колдонуучусу</div>`}

    </div>

    <div class="stats">
      ${isAdmin()?`
        <div class="card stat">
          <b>${myMaterials.size}</b>

        </div>

        <div class="card stat">
          <b>—</b>
          <span>Күтүүдөгү төлөм</span>
        </div>

        <div class="card stat">
          <b>—</b>
          <span>Колдонуучулар</span>
        </div>

          <b>${myMaterials.size}</b>
          <span>Материал</span>
        </div>

        <div class="card stat">
          <b>${purchases.size}</b>
          <span>Сатып алынган</span>
        </div>

          <b>—</b>

      </button>

        <button class="btn secondary full" id="adminMaterials">

        </button>
      `:""}

      <button class="btn danger full" id="logout">
        Чыгуу
      </button>

    </div>

    <div class="section-title" style="margin-top:25px">
      ${isAdmin()?"Менин материалдарым":"Сатып алган материалдарым"}
    </div>

    <div class="stack" id="profileMaterials"></div>
  `;
}


async function loadProfileMaterials(){
  const box=document.getElementById("profileMaterials");
  if(!box)return;

  let snap;

  if(isAdmin()){
    snap=await getDocs(query(
      collection(db,"materials"),
      where("authorId","==",currentUser.uid),
      limit(50)
    ));
  }else{
    const purchases=await getDocs(
      collection(db,"users",currentUser.uid,"purchases")
    );

    if(purchases.empty){
      box.innerHTML=`
        <div class="card empty">
          Азырынча сатып алган материалыңыз жок
        </div>`;
      return;
    }

    const ids=purchases.docs.map(d=>d.id);

    const arr=[];

    for(const id of ids){
      const s=await getDoc(doc(db,"materials",id));
      if(s.exists())arr.push(s);
    }

    if(!arr.length){
      box.innerHTML=`
        <div class="card empty">
          Азырынча сатып алган материалыңыз жок
        </div>`;
      return;
    }

    box.innerHTML=arr.map(d=>materialMini(d.id,d.data())).join("");
    return;
  }

  if(snap.empty){
    box.innerHTML=`<div class="card empty">Материал жок.</div>`;
    return;
  }

  box.innerHTML=snap.docs.map(d=>materialMini(d.id,d.data())).join("");
}

function materialMini(id,m){
  return `
    <button class="card" style="padding:15px;text-align:left"
      data-material="${id}">
      <div style="font-size:25px">
        ${categories[m.category]?.icon||"📦"}
      </div>
      <b>${esc(m.title)}</b>
      <div class="material-meta">${categories[m.category]?.name||""}</div>
    </button>
  `;
}


/* =========================================================
   EDIT PROFILE
========================================================= */

function editProfileModal(){
  const m=modal(`
    <div class="modal-head">
      <div class="modal-title">Профиль оңдоо</div>
      <button class="icon-btn" onclick="closeModal()">×</button>
    </div>

    <form id="profileForm" class="form">

      <input class="input" name="name"
        value="${esc(currentProfile?.name||"")}"
        placeholder="Аты">

      <input class="input" name="phone"
        value="${esc(currentProfile?.phone||"")}"
        placeholder="Телефон номери">

      <input class="input" name="age"
        value="${esc(currentProfile?.age||"")}"
        placeholder="Жаш">

      <label class="label">
        Профиль сүрөтү
      </label>

      <input class="file" type="file"
        name="photo" accept="image/*">

      <div class="progress-wrap hidden" id="profileProgress">
        <div class="progress">
          <div class="progress-bar"></div>
        </div>
        <div class="progress-text">0%</div>
      </div>

      <button class="btn full">Сактоо</button>
    </form>
  `);

  m.querySelector("form").onsubmit=async e=>{
    e.preventDefault();

    const f=e.target;
    const name=f.name.value.trim();

    if(!name){
      toast("Атыңызды жазыңыз.");
      return;
    }

    let photo=currentProfile.photo||"";

    if(f.photo.files[0]){
      const p=m.querySelector("#profileProgress");
      const bar=p.querySelector(".progress-bar");
      const label=p.querySelector(".progress-text");
      p.classList.remove("hidden");

      const r=await cloudinaryUpload(f.photo.files[0],x=>{
        bar.style.width=x+"%";
        label.textContent=x+"%";
      });

      photo=r.secure_url;
    }

    await updateDoc(doc(db,"users",currentUser.uid),{
      name,
      phone:f.phone.value.trim(),
      age:f.age.value.trim(),
      photo
    });

    await updateProfile(currentUser,{displayName:name,photoURL:photo});

    currentProfile=await getProfile();
    closeModal();
    toast("Профиль жаңыртылды.");
    render();
  };
}


/* =========================================================
   EVENT DELEGATION
========================================================= */

document.addEventListener("click",async e=>{
  const nav=e.target.closest("[data-nav]");
  if(nav){
    if(unsubscribeMessages){
      unsubscribeMessages();
      unsubscribeMessages=null;
    }

    currentPage=nav.dataset.nav;
    history.pushState({page:currentPage},"",`#${currentPage}`);
    render();
    return;
  }

  const like=e.target.closest("[data-like]");
  if(like){
    await toggleLike(like.dataset.like);
    return;
  }

  const likes=e.target.closest("[data-likes]");
  if(likes){
    await showLikes(likes.dataset.likes);
    return;
  }

  const comments=e.target.closest("[data-comments]");
  if(comments){
    await showComments(comments.dataset.comments);
    return;
  }

  const more=e.target.closest("[data-more]");
  if(more){
    const id=more.dataset.more;

    modal(`
      <div class="stack">
        <button class="btn secondary full" id="editSelected">
          Постту өзгөртүү
        </button>

        <button class="btn danger full" id="deleteSelected">
          Постту өчүрүү
        </button>
      </div>
    `);

    document.getElementById("editSelected").onclick=()=>{
      closeModal();
      editPost(id);
    };

    document.getElementById("deleteSelected").onclick=()=>{
      closeModal();
      deletePost(id);
    };

    return;
  }

  const cat=e.target.closest("[data-category]");
  if(cat){
    loadCategory(cat.dataset.category);
    return;
  }

  const mat=e.target.closest("[data-material]");
  if(mat){
    openMaterial(mat.dataset.material);
    return;
  }

  const create=e.target.closest("[data-create-category]");
  if(create){
    materialForm(create.dataset.createCategory);
    return;
  }

  const chat=e.target.closest("[data-chat-user]");
  if(chat){
    openChat(chat.dataset.chatUser);
    return;
  }

  const profile=e.target.closest("[data-user-profile]");
  if(profile){
    const uid=profile.dataset.userProfile;
    currentPage="user-"+uid;
    renderUserProfile(uid);
    return;
  }
});


/* =========================================================
   PAGE RENDER
========================================================= */

async function render(){
  if(!currentUser){
    renderLogin();
    return;
  }

  currentProfile=await getProfile();

  if(currentPage==="home"){
    app.innerHTML=shell(`
      <div id="posts" class="stack"></div>
      <div id="loadMore" style="height:30px"></div>
    `);

    document.getElementById("refreshBtn").onclick=()=>{
      postCursor=null;
      noMorePosts=false;
      loadPosts(true);
    };

    document.getElementById("fab").onclick=postModal;

    await loadPosts(true);

    const observer=new IntersectionObserver(entries=>{
      if(entries[0].isIntersecting)loadPosts();
    });

    observer.observe(document.getElementById("loadMore"));
    return;
  }

  if(currentPage==="search"){
    app.innerHTML=shell(searchPage(),"Издөө");

    document.getElementById("refreshBtn").onclick=render;

    const input=document.getElementById("searchInput");

    input.addEventListener("input",()=>{
      clearTimeout(searchTimer);
      searchTimer=setTimeout(
        ()=>searchUsers(input.value),
        350
      );
    });

    return;
  }

  if(currentPage==="materials"){
    app.innerHTML=shell(await materialsPage(),"Материалдар");

    document.getElementById("refreshBtn").onclick=render;
    document.getElementById("fab").onclick=materialCreateModal;
    return;
  }

  if(currentPage==="profile"){
    app.innerHTML=shell(await profilePage(),"Профиль");

    document.getElementById("refreshBtn").onclick=render;
    document.getElementById("editProfile").onclick=editProfileModal;
    document.getElementById("logout").onclick=logout;

    document.getElementById("adminMaterials")?.addEventListener(
      "click",materialCreateModal
    );

    await loadProfileMaterials();
    return;
  }

  if(currentPage==="chat"){
    /*
      Chat navigation негизги Chat list катары Search аркылуу ачылат.
    */
    app.innerHTML=shell(`
      <div class="card empty">
        Издөө бөлүмүнөн колдонуучуну тандап чат ачыңыз.
      </div>
    `,"Чат");
    return;
  }
}


async function renderUserProfile(uid){
  currentProfile=await getProfile();
  app.innerHTML=shell(
    `<div class="card empty">Жүктөлүүдө...</div>`,
    "Профиль"
  );

  const content=await userProfilePage(uid);

  app.innerHTML=shell(content,"Профиль");

  document.getElementById("refreshBtn").onclick=()=>renderUserProfile(uid);

  document.getElementById("profileChat").onclick=()=>{
    openChat(uid);
  };
}


function renderLogin(){
  app.innerHTML=`
    <div class="auth">
      <div class="card auth-box">
        <div class="auth-logo">DOSTA</div>
        <div class="auth-sub">
          Оку, бөлүш, машык, баарлаш.
        </div>

        <button class="btn full" id="googleLogin">
          Google менен кирүү
        </button>
      </div>
    </div>
  `;

  document.getElementById("googleLogin").onclick=loginGoogle;
}


/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(auth,async user=>{
  currentUser=user;

  if(user){
    await ensureUser(user);
    currentProfile=await getProfile();
    render();
  }else{
    if(unsubscribeMessages)unsubscribeMessages();
    renderLogin();
  }
});


/* =========================================================
   SERVICE WORKER-LIKE VISIBILITY / CLEANUP
========================================================= */

window.addEventListener("beforeunload",()=>{
  if(unsubscribeChat)unsubscribeChat();
  if(unsubscribeMessages)unsubscribeMessages();
});

</script>
